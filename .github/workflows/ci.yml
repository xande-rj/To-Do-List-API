name: CI - Testes Automatizados

on:
  push:
    branches: [ "main"]  # ou outras branches que desejar
  pull_request:
    branches: [ "main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 25 (ou a versão do seu projeto)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven  # opcional, acelera o build

      - name: Rodar testes com Maven
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: mvn clean test

      - name: Upload de relatórios de teste (opcional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/